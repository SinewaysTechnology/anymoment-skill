name: Auto-assign Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-and-request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to davidjonas
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: ['davidjonas']
              });
              console.log('Successfully assigned PR to davidjonas');
            } catch (error) {
              console.log('Failed to assign PR:', error.message);
            }

      - name: Request review from davidjonas
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prAuthor = context.payload.pull_request.user.login;
            
            if (prAuthor === 'davidjonas') {
              console.log('PR author is davidjonas, skipping self-review request');
              return;
            }
            
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: ['davidjonas']
              });
              console.log('Successfully requested review from davidjonas');
            } catch (error) {
              console.log('Failed to request review:', error.message);
            }
