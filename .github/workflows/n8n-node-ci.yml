name: n8n node CI

on:
  pull_request:
    paths:
      - 'n8n/**'
      - '.github/workflows/n8n-node-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n/nodes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: n8n/nodes/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
